name: kharcha_app
description: "Nepali BS-calendar expense tracker with an AI mascot"
publish_to: 'none'
version: 1.0.5+7

environment:
  sdk: ^3.13.4

dependencies:
  connectivity_plus: ^7.3.1
  csv: ^8.0.0
  file_picker: ^13.1.0
  http: ^1.3.0
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  liquid_glass_easy: ^4.3.2
  local_auth: ^2.2.0
  nepali_utils: ^3.0.8
  path_provider: ^2.1.6
  pdf: ^3.13.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  uuid: ^4.6.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/festivals/

# Launcher icon config lives in flutter_launcher_icons.yaml at the project root,
# which `dart run flutter_launcher_icons` reads in preference to this file.

